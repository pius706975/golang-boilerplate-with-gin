version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_test
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_network

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: go-backend
    command: ["serve"]
    ports:
      - "5001:5000"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge

volumes:
  db_data:
